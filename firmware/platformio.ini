; ESP32-WROOM-32 — JSY-MK-194G Modbus + BLE provisioning + HTTP telemetry
[platformio]
default_envs = esp32dev

[common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.3.0

; Build without JSY hardware (FakeCurrentSensor)
[env:esp32dev]
extends = common
build_flags =
    -DUSE_FAKE_SENSOR=1
    -DUSE_JSY_SENSOR=0

; Real JSY-MK-194G via MycilaJSY (recommended)
[env:esp32dev_jsy]
extends = common
build_flags =
    -DUSE_FAKE_SENSOR=0
    -DUSE_JSY_SENSOR=1
    -DUSE_MYCILA_JSY=1
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    ${common.lib_deps}
    mathieucarbou/MycilaJSY@^15.3.5

; Raw Modbus fallback (no MycilaJSY dependency)
[env:esp32dev_jsy_raw]
extends = common
build_flags =
    -DUSE_FAKE_SENSOR=0
    -DUSE_JSY_SENSOR=1
    -DUSE_MYCILA_JSY=0
    -DJSY_MODBUS_BAUD=4800
    -DJSY_MODBUS_ADDRESS=1

; Example: CT scale correction (override in build_flags or platformio.ini)
; [env:esp32dev_jsy_scaled]
; extends = env:esp32dev_jsy
; build_flags =
;     ${env:esp32dev_jsy.build_flags}
;     -DCURRENT_SCALE=0.67f
