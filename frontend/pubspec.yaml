name: tek_sensor_monitor
description: TEC sensor downtime monitoring dashboard
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  dio: 5.7.0
  flutter_riverpod: 2.6.1
  go_router: 14.6.2
  intl: 0.19.0
  google_fonts: ^6.3.0
  shared_preferences: 2.3.3
  syncfusion_flutter_charts: 27.2.5
  web_socket_channel: 3.0.1
  flutter_blue_plus: 2.3.10
  flutter_blue_plus_winrt: 0.0.20
  flutter_local_notifications: 18.0.1
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  web:
    generate: true
    image_path: assets/icons/app_icon.png
    favicon: true
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icons/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_tec.jpg
    - assets/images/logo_tec_alt.jpg
    - assets/icons/app_icon.png
