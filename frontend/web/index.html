<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TEC sensor monitoring dashboard">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ТЭК Мониторинг">
  <meta name="theme-color" content="#0A0E14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F0F3F7" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>ТЭК · Мониторинг датчиков</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0A0E14;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    }
    #tek-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: radial-gradient(ellipse at 50% 0%, #121820 0%, #0A0E14 55%);
      color: #E8EDF4;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #tek-splash.hide { opacity: 0; pointer-events: none; }
    #tek-splash .logo {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      object-fit: contain;
      animation: tek-pulse 1.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 24px rgba(0, 201, 167, 0.25));
    }
    #tek-splash h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    #tek-splash p {
      margin: 0;
      color: #7D8B9E;
      font-size: 0.9rem;
    }
    @keyframes tek-pulse {
      0%, 100% { transform: scale(1); opacity: 0.92; }
      50% { transform: scale(1.04); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #tek-splash .logo { animation: none; }
    }
  </style>
</head>
<body>
  <div id="tek-splash" aria-live="polite" aria-busy="true">
    <img class="logo" src="icons/Icon-192.png" alt="ТЭК" width="112" height="112">
    <h1>ТЭК · Мониторинг</h1>
    <p>Загрузка приложения…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('tek-splash');
      if (!splash) return;
      splash.classList.add('hide');
      splash.setAttribute('aria-busy', 'false');
      setTimeout(function () { splash.remove(); }, 450);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
